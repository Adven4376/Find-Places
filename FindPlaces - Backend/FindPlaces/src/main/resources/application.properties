spring.application.name=FindPlaces

# server config
server.port = 9090

# db config
spring.datasource.driver_class_name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/community_map
spring.datasource.username = root
spring.datasource.password = root

# jpa config
spring.jpa.hibernate.ddl-auto= update
spring.jpa.hibernate.show-sql = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#jwt
app.jwt.secret=change-this-to-a-very-long-random-secret-key-12345678901234567890
app.jwt.expiration=86400000

#image uploads config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=file:uploads/